[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sciscape"
version = "0.1.0"
description = "SciScape: Leiden clustering + keyword extraction toolkit."
readme = "sciscape/README.md"
requires-python = ">=3.10"
license = "LicenseRef-KRISS-Internal"
authors = [{ name = "KRISS" }]
dependencies = [
  "igraph>=1.0.0",
  "leidenalg>=0.11.0",
  "polars>=0.20.0",
  "numpy>=1.23",
  "pandas>=1.5",
  "scipy>=1.10",
  "scikit-learn>=1.2",
  "joblib>=1.2",
]

[project.optional-dependencies]
arrow = ["pyarrow>=12"]
llm = ["openai>=1.0"]
mysql = ["pymysql>=1.0"]
dev = ["pytest>=8", "build>=1.2"]

[project.scripts]
sciscape = "sciscape.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["sciscape*", "sos*"]
