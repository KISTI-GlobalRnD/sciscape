name: CI

on:
  push:
    branches: [main, "split/*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install maturin
        run: pip install maturin

      - name: Build & install Rust modules
        run: |
          cd rust && maturin develop --release && cd ..
          cd rust-text && maturin develop --release && cd ..

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,viz,arrow,openalex,web]"

      - name: Run Rust tests
        run: |
          cd rust && cargo test --release && cd ..
          cd rust-text && cargo test --release && cd ..

      - name: Run Python tests
        run: pytest -q --tb=short

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Check formatting
        run: ruff check sciscape/ tests/ --select E,F,W --ignore E501
