[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "sciscape-text"
version = "0.1.0"
description = "High-performance text similarity and co-occurrence for sciscape"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]

[tool.maturin]
features = ["python"]
