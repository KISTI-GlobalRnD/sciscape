[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "cpm-dendro"
version = "0.1.0"
description = "CPM-critical dendrogram construction via sparse average-linkage HAC"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]

[tool.maturin]
features = ["pyo3/extension-module"]
